# Build and run the app locally from source:
#   COMMIT=$(git rev-parse --short HEAD) docker compose up --build
# (or `podman compose ...`). Then open http://localhost:8080.
#
# To run a published release instead, see "Deployment" in the README.
services:
  cookbook:
    build:
      context: .
      args:
        COMMIT: ${COMMIT:-dev}
    image: family-cookbook
    ports:
      - "8080:8080"
    volumes:
      - cookbook-data:/data
    restart: unless-stopped

volumes:
  cookbook-data:
