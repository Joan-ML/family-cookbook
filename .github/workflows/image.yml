name: Image

# Build once, promote by tagging:
#   - push to main  -> build the image, smoke-test it, run the Playwright suite (e2e/)
#                      against it, then push that exact image as
#                      ghcr.io/<owner>/<repo>:sha-<commit> and :main
#   - pull request  -> build and test only
#   - tag v1.2.3    -> copy the commit's existing image to 1.2.3, 1.2 and latest,
#                      digest unchanged (no rebuild)
#
# Images only know their commit; the release version is given at deploy time
# (APP_VERSION).

on:
  push:
    # Every commit on main gets an image, so any of them can be released.
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/image.yml"

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: image-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - uses: docker/setup-buildx-action@v4

      # The only build. The image is loaded locally, tested, and pushed as is.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
          COMMIT: ${{ steps.commit.outputs.short }}
        run: |
          image=$(head -n1 <<< "$IMAGE")
          docker run -d --name cookbook -p 8080:8080 -v cookbook-data:/data \
            -e APP_VERSION=v0.0.0-smoke "$image"
          trap 'docker logs cookbook' EXIT

          curl -sf --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/api/health
          # The image knows its commit, and reports the version it was deployed as.
          curl -sf http://localhost:8080/api/info | tee /dev/stderr \
            | grep -q "\"commit\":\"$COMMIT\",\"version\":\"v0.0.0-smoke\""
          # The UI is embedded, including for client-side routes.
          curl -sf http://localhost:8080/recipes/anything | grep -q '<title>Family Cookbook</title>'
          # The unprivileged user can write to the data volume.
          curl -sf -X POST http://localhost:8080/api/recipes -H 'Content-Type: application/json' \
            -d '{"name":"Smoke test","ingredients":[],"steps":[],"tags":[]}'
          curl -sf http://localhost:8080/api/recipes | grep -q 'Smoke test'

      # End-to-end tests against the running image, on phone-sized Chromium and WebKit.
      - uses: actions/setup-node@v7
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: End-to-end tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium webkit
          npx playwright test

      - name: Upload end-to-end report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$TAGS"

  promote:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Find the commit's image
        id: source
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "ref=$image:sha-$commit" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.source.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
          skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"

      - name: Wait for the image
        env:
          SOURCE: ${{ steps.source.outputs.ref }}
        run: |
          # A tag pushed together with its commit races the main build; give it time.
          for _ in $(seq 1 40); do
            if skopeo inspect --raw "docker://$SOURCE" >/dev/null 2>&1; then
              echo "Found $SOURCE"
              exit 0
            fi
            echo "Waiting for $SOURCE..."
            sleep 30
          done
          echo "::error::No image $SOURCE. Only commits built on main can be released."
          exit 1

      - name: Promote
        env:
          SOURCE: ${{ steps.source.outputs.ref }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          digest() { skopeo inspect --raw "docker://$1" | sha256sum | cut -d' ' -f1; }
          want=$(digest "$SOURCE")
          echo "Promoting $SOURCE (sha256:$want)"
          while read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --all --preserve-digests "docker://$SOURCE" "docker://$tag"
            got=$(digest "$tag")
            if [ "$got" != "$want" ]; then
              echo "::error::$tag has digest sha256:$got, expected sha256:$want"
              exit 1
            fi
            echo "$tag -> sha256:$got"
          done <<< "$TAGS"
