name: Image

# Builds the single deployable image, checks that it runs, and publishes it
# to GitHub Container Registry:
#   - tag v1.2.3     -> ghcr.io/<owner>/<repo>:1.2.3, :1.2 and :latest
#   - push to main   -> ghcr.io/<owner>/<repo>:main
#   - pull request   -> built and tested, not published

on:
  push:
    branches: [main]
    tags: ["v*"] # path filters don't apply to tag pushes
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/image.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags

      - name: Determine version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: family-cookbook:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name cookbook -p 8080:8080 -v cookbook-data:/data family-cookbook:ci
          trap 'docker logs cookbook' EXIT

          curl -sf --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/api/health \
            | tee /dev/stderr | grep -q "\"version\":\"$VERSION\""
          # The UI is embedded, including for client-side routes.
          curl -sf http://localhost:8080/recipes/anything | grep -q '<title>Family Cookbook</title>'
          # The unprivileged user can write to the data volume.
          curl -sf -X POST http://localhost:8080/api/recipes -H 'Content-Type: application/json' \
            -d '{"name":"Smoke test","ingredients":[],"steps":[],"tags":[]}'
          curl -sf http://localhost:8080/api/recipes | grep -q 'Smoke test'

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha # reuses the layers built above
