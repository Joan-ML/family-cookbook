openapi: 3.0.3
info:
  title: Family Cookbook API
  version: 0.7.0
  description: |
    Contract between the Go backend and the React frontend.
    Backend tests validate real responses against this file, and both sides
    generate their types from it. Change this file first.

    Conventions:
    - Every endpoint requires a session cookie unless it declares `security: []`.
      Log in with `POST /session`; without a valid session, endpoints answer 401.
    - Errors use the `Error` schema.
    - Recipes belong to cookbooks. Cookbooks and their recipes only exist for
      the cookbook's members: everyone else gets 404, never 403. Members whose
      role doesn't allow an action get 403.
    - Collections are returned as `{ "items": [...] }`, leaving room for
      pagination fields later.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /info:
    get:
      operationId: getInfo
      summary: Which build is running
      description: Public for now, so the footer can show it before login exists.
      security: []
      responses:
        "200":
          description: The running build.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"

  /session:
    post:
      operationId: logIn
      summary: Log in
      description: |
        Starts a session and sets the `session` cookie (HttpOnly, SameSite=Lax,
        and Secure unless the server is configured for plain HTTP). Unknown
        usernames and wrong passwords get the same answer. After repeated
        failures for a username, further attempts are refused for a while.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong username or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: logOut
      summary: Log out
      description: |
        Ends the current session, if any, and clears the cookie. Always
        succeeds, so it's safe to call when the session has already expired.
      security: []
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string

  /password/setup:
    post:
      operationId: setUpPassword
      summary: Choose a password with a setup link
      description: |
        Setup links are created by the server admin (`cookbook user add` and
        `cookbook user reset`). Each works once and expires after 48 hours.
        Setting the password ends the user's other sessions and logs them in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordSetup"
      responses:
        "200":
          description: Password set; logged in.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: The link is invalid, used or expired, or the password is too weak.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/password:
    put:
      operationId: changePassword
      summary: Change your password
      description: |
        Needs the current password. Ends your other sessions; this one stays
        logged in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed.
        "400":
          description: The current password is wrong, or the new one is too weak.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me:
    get:
      operationId: getMe
      summary: The logged-in user
      description: The frontend calls this on start to know whether to show the login page.
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cookbooks:
    get:
      operationId: listCookbooks
      summary: The cookbooks you're a member of
      responses:
        "200":
          description: Your cookbooks, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookbookList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCookbook
      summary: Create a cookbook
      description: You become its admin, and its only member until you invite others.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CookbookInput"
      responses:
        "201":
          description: The created cookbook.
          headers:
            Location:
              description: URL of the new cookbook.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cookbook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cookbooks/{cookbookId}:
    parameters:
      - $ref: "#/components/parameters/CookbookId"
    get:
      operationId: getCookbook
      summary: Get a cookbook
      responses:
        "200":
          description: The cookbook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cookbook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: renameCookbook
      summary: Rename a cookbook (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CookbookInput"
      responses:
        "200":
          description: The renamed cookbook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cookbook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCookbook
      summary: Delete a cookbook and all its recipes (admins only)
      responses:
        "204":
          description: The cookbook and its recipes were deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /cookbooks/{cookbookId}/members:
    parameters:
      - $ref: "#/components/parameters/CookbookId"
    get:
      operationId: listMembers
      summary: Who's in a cookbook
      description: Every member can see the members and their roles.
      responses:
        "200":
          description: The members, sorted by username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addMember
      summary: Add a user to a cookbook (admins only)
      description: |
        Adds an existing account straight away; there is no invitation to
        accept. The cookbook then appears in their list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: The new member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Malformed request, or no account has that username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /cookbooks/{cookbookId}/members/{username}:
    parameters:
      - $ref: "#/components/parameters/CookbookId"
      - $ref: "#/components/parameters/Username"
    put:
      operationId: changeRole
      summary: Change a member's role (admins only)
      description: Refused with 409 if it would leave the cookbook without an admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: The member with their new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: removeMember
      summary: Remove a member, or leave
      description: |
        Admins can remove anyone; any member can remove themselves, which is
        leaving. Refused with 409 if it would leave the cookbook without an
        admin: the last admin must first make someone else admin, or delete
        the cookbook.
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /cookbooks/{cookbookId}/recipes:
    parameters:
      - $ref: "#/components/parameters/CookbookId"
    get:
      operationId: listRecipes
      summary: List a cookbook's recipes
      responses:
        "200":
          description: The cookbook's recipes, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRecipe
      summary: Create a recipe in a cookbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "201":
          description: The created recipe.
          headers:
            Location:
              description: URL of the new recipe.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /cookbooks/{cookbookId}/recipes/{recipeId}:
    parameters:
      - $ref: "#/components/parameters/CookbookId"
      - $ref: "#/components/parameters/RecipeId"
    get:
      operationId: getRecipe
      summary: Get a recipe
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRecipe
      summary: Replace a recipe's content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteRecipe
      summary: Delete a recipe
      responses:
        "204":
          description: The recipe was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

  parameters:
    CookbookId:
      name: cookbookId
      in: path
      required: true
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not logged in, or the session has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: You're a member, but your role doesn't allow this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The change conflicts with the cookbook's members: the user is already
        a member, or the cookbook would be left without an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        The resource does not exist, or belongs to a cookbook you're not a
        member of: the two are indistinguishable, so cookbooks can't be discovered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many failed attempts; try again later.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The request body exceeds the size limit (1 MiB for JSON).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Info:
      type: object
      required: [commit]
      properties:
        version:
          description: Release version given at deploy time, e.g. "v1.2.3". Absent for unreleased builds.
          type: string
        commit:
          description: Commit the build came from, e.g. "abc1234", or "dev" when unknown.
          type: string

    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password

    PasswordSetup:
      type: object
      required: [token, password]
      properties:
        token:
          description: The part of the setup link after "#".
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          format: password

    User:
      type: object
      required: [username]
      properties:
        username:
          type: string

    Role:
      description: |
        Your role in a cookbook. Admins also manage its members, rename it and
        delete it; editors create, edit and delete its recipes.
      type: string
      enum: [admin, editor]

    Member:
      type: object
      required: [username, role, joinedAt]
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time

    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    MemberInput:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        role:
          $ref: "#/components/schemas/Role"

    RoleInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    CookbookInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    Cookbook:
      type: object
      required: [id, name, role, createdAt, createdBy]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
        createdBy:
          description: Username of the user who created the cookbook.
          type: string

    CookbookSummary:
      type: object
      required: [id, name, role, recipeCount]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        recipeCount:
          type: integer
          minimum: 0

    CookbookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CookbookSummary"

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable description of the problem.

    RecipeInput:
      description: The fields of a recipe that users edit.
      type: object
      required: [name, ingredients, steps, tags]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        ingredients:
          description: One free-text line per ingredient, e.g. "200 g flour".
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
        steps:
          description: Cooking instructions, one entry per step, in order.
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 5000
        tags:
          description: |
            Free-form tags, e.g. "vegetarian". The server trims and lowercases
            them and removes duplicates.
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
        servings:
          description: How many people the recipe serves. Absent if not given.
          type: integer
          minimum: 1
          maximum: 100
        source:
          description: Where the recipe comes from, e.g. a URL, a book or "Grandma".
          type: string
          maxLength: 500

    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeInput"
        - type: object
          required: [id, createdAt, createdBy, updatedAt, updatedBy]
          properties:
            id:
              type: string
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
            createdBy:
              description: Username of the user who created the recipe.
              type: string
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            updatedBy:
              description: Username of the user who last edited the recipe.
              type: string
              readOnly: true

    RecipeSummary:
      description: The fields needed to show a recipe in a list.
      type: object
      required: [id, name, tags]
      properties:
        id:
          type: string
        name:
          type: string
        tags:
          type: array
          items:
            type: string

    RecipeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
