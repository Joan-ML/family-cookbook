openapi: 3.0.3
info:
  title: Family Cookbook API
  version: 0.3.0
  description: |
    Contract between the Go backend and the React frontend.
    Backend tests validate real responses against this file, and both sides
    generate their types from it. Change this file first.

    Conventions:
    - Every endpoint requires a session cookie unless it declares `security: []`.
      Log in with `POST /session`; without a valid session, endpoints answer 401.
    - Errors use the `Error` schema.
    - Collections are returned as `{ "items": [...] }`, leaving room for
      pagination fields later.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /info:
    get:
      operationId: getInfo
      summary: Which build is running
      description: Public for now, so the footer can show it before login exists.
      security: []
      responses:
        "200":
          description: The running build.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"

  /session:
    post:
      operationId: logIn
      summary: Log in
      description: |
        Starts a session and sets the `session` cookie (HttpOnly, SameSite=Lax,
        and Secure unless the server is configured for plain HTTP). Unknown
        usernames and wrong passwords get the same answer. After repeated
        failures for a username, further attempts are refused for a while.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong username or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: logOut
      summary: Log out
      description: |
        Ends the current session, if any, and clears the cookie. Always
        succeeds, so it's safe to call when the session has already expired.
      security: []
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string

  /me:
    get:
      operationId: getMe
      summary: The logged-in user
      description: The frontend calls this on start to know whether to show the login page.
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /recipes:
    get:
      operationId: listRecipes
      summary: List all recipes
      responses:
        "200":
          description: All recipes, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRecipe
      summary: Create a recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "201":
          description: The created recipe.
          headers:
            Location:
              description: URL of the new recipe.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /recipes/{recipeId}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      operationId: getRecipe
      summary: Get a recipe
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRecipe
      summary: Replace a recipe's content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteRecipe
      summary: Delete a recipe
      responses:
        "204":
          description: The recipe was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

  parameters:
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not logged in, or the session has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many failed attempts; try again later.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The request body exceeds the size limit (1 MiB for JSON).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Info:
      type: object
      required: [commit]
      properties:
        version:
          description: Release version given at deploy time, e.g. "v1.2.3". Absent for unreleased builds.
          type: string
        commit:
          description: Commit the build came from, e.g. "abc1234", or "dev" when unknown.
          type: string

    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password

    User:
      type: object
      required: [username]
      properties:
        username:
          type: string

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable description of the problem.

    RecipeInput:
      description: The fields of a recipe that users edit.
      type: object
      required: [name, ingredients, steps, tags]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        ingredients:
          description: One free-text line per ingredient, e.g. "200 g flour".
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
        steps:
          description: Cooking instructions, one entry per step, in order.
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 5000
        tags:
          description: |
            Free-form tags, e.g. "vegetarian". The server trims and lowercases
            them and removes duplicates.
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
        source:
          description: Where the recipe comes from, e.g. a URL, a book or "Grandma".
          type: string
          maxLength: 500

    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeInput"
        - type: object
          required: [id, createdAt, createdBy, updatedAt, updatedBy]
          properties:
            id:
              type: string
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
            createdBy:
              description: Username of the user who created the recipe.
              type: string
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            updatedBy:
              description: Username of the user who last edited the recipe.
              type: string
              readOnly: true

    RecipeSummary:
      description: The fields needed to show a recipe in a list.
      type: object
      required: [id, name, tags]
      properties:
        id:
          type: string
        name:
          type: string
        tags:
          type: array
          items:
            type: string

    RecipeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
