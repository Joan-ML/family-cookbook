# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
package: api
output: api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
compatibility:
  # Recipe is only ever a response, so server-set readOnly fields are always present.
  disable-required-readonly-as-pointer: true
